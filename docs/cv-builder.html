<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pembuat CV Cepat — KarierKu</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <div id="app-nav"></div>
  <main>
    <h1>Pembuat CV Cepat</h1>
    <p>CV dibuat otomatis dari data <a href="profile.html">Biografi & Karier</a> kamu, disesuaikan dengan posisi yang kamu tuju.</p>
    <div id="alert-box"></div>

    <div class="card no-print">
      <label>Posisi yang dituju</label>
      <input type="text" id="target-title" placeholder="mis. Staf Admin Keuangan">
      <label>Ringkasan tambahan untuk posisi ini (opsional)<span class="hint">mis. sebutkan kenapa kamu cocok untuk posisi ini</span></label>
      <textarea id="target-note"></textarea>
      <div class="btn-row">
        <button type="button" id="generate-btn">Buat CV</button>
      </div>
    </div>

    <div id="cv-output" style="display:none;">
      <div class="btn-row no-print">
        <button type="button" id="copy-btn" class="btn secondary">Salin sebagai teks</button>
        <button type="button" id="pdf-btn" class="btn secondary">Unduh sebagai PDF</button>
        <button type="button" id="docx-btn" class="btn secondary">Unduh sebagai Word (.docx)</button>
      </div>
      <div class="cv-preview" id="cv-preview"></div>
    </div>
  </main>
</div>

<!-- Pustaka ekspor berjalan sepenuhnya di browser (butuh koneksi internet saat dipakai) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/cv-builder.js"></script>
</body>
</html>
