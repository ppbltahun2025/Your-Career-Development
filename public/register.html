<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Akun — KarierKu</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <div id="app-nav"></div>
  <main style="max-width:480px;">
    <h1>Buat Akun</h1>
    <p>Punya akun berarti datamu tersimpan di server dan bisa diverifikasi lewat email. Kalau tidak mau mendaftar, kamu tetap bisa memakai semua fitur di <a href="index.html">mode tamu</a>.</p>

    <div id="alert-box"></div>

    <form id="register-form">
      <label for="name">Nama lengkap</label>
      <input type="text" id="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" required>

      <label for="password">Password<span class="hint">Minimal 8 karakter</span></label>
      <input type="password" id="password" required minlength="8">

      <div class="btn-row">
        <button type="submit">Daftar</button>
      </div>
    </form>
    <p style="margin-top:16px;">Sudah punya akun? <a href="login.html">Masuk di sini</a>.</p>
  </main>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script>
renderNav('');
document.getElementById('register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const box = document.getElementById('alert-box');
  box.innerHTML = '';

  const res = await Auth.register(name, email, password);
  if (res.ok) {
    box.innerHTML = `<div class="alert success">${res.data.message} Setelah terverifikasi, <a href="login.html">masuk di sini</a>.</div>`;
    document.getElementById('register-form').reset();
  } else if (res.offline) {
    box.innerHTML = `<div class="alert error">Backend tidak aktif/terhubung. Fitur akun butuh backend berjalan (lihat README). Kamu tetap bisa memakai mode tamu di <a href="index.html">beranda</a>.</div>`;
  } else {
    box.innerHTML = `<div class="alert error">${res.error}</div>`;
  }
});
</script>
</body>
</html>
