<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biografi & Karier — KarierKu</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <div id="app-nav"></div>
  <main>
    <h1>Biografi & Karier Kamu</h1>
    <p>Data ini menjadi dasar untuk fitur Pembuat CV Cepat. Isi sejujur dan sejelas mungkin.</p>
    <div id="alert-box"></div>

    <form id="profile-form">
      <label for="biography">Biografi singkat<span class="hint">Ceritakan latar belakang dan tujuan kariermu dalam beberapa kalimat.</span></label>
      <textarea id="biography"></textarea>

      <div class="grid-2">
        <div>
          <label for="currentRole">Posisi/peran saat ini</label>
          <input type="text" id="currentRole" placeholder="mis. Staf Pemasaran">
        </div>
        <div>
          <label for="currentCompany">Instansi/perusahaan saat ini</label>
          <input type="text" id="currentCompany" placeholder="mis. PT Maju Bersama">
        </div>
      </div>

      <label for="skills">Keahlian<span class="hint">Pisahkan dengan koma, mis. Microsoft Excel, Manajemen Proyek, Public Speaking</span></label>
      <input type="text" id="skills">

      <hr class="divider">
      <h2>Pengalaman Kerja</h2>
      <div id="experience-list"></div>
      <button type="button" class="btn secondary" id="add-experience">+ Tambah pengalaman</button>

      <hr class="divider">
      <h2>Pendidikan</h2>
      <div id="education-list"></div>
      <button type="button" class="btn secondary" id="add-education">+ Tambah pendidikan</button>

      <div class="btn-row">
        <button type="submit">Simpan Profil</button>
      </div>
    </form>
  </main>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
