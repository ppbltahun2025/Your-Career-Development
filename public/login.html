<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — KarierKu</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <div id="app-nav"></div>
  <main style="max-width:480px;">
    <h1>Masuk</h1>
    <div id="alert-box"></div>

    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" required>

      <div class="btn-row">
        <button type="submit">Masuk</button>
      </div>
    </form>

    <p style="margin-top:16px;">
      Belum punya akun? <a href="register.html">Daftar di sini</a>.<br>
      Email belum terverifikasi? <button class="link" style="background:none;border:none;padding:0;color:var(--evergreen-dark);text-decoration:underline;cursor:pointer;" id="resend-btn">Kirim ulang email verifikasi</button>
    </p>
  </main>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script>
renderNav('');
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const box = document.getElementById('alert-box');
  box.innerHTML = '';

  const res = await Auth.login(email, password);
  if (res.ok) {
    window.location.href = 'profile.html';
  } else if (res.offline) {
    box.innerHTML = `<div class="alert error">Backend tidak aktif/terhubung. Fitur akun butuh backend berjalan (lihat README). Kamu tetap bisa memakai mode tamu di <a href="index.html">beranda</a>.</div>`;
  } else {
    box.innerHTML = `<div class="alert error">${res.error}</div>`;
  }
});

document.getElementById('resend-btn').addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  const box = document.getElementById('alert-box');
  if (!email) { box.innerHTML = '<div class="alert error">Isi email dulu di atas.</div>'; return; }
  const res = await Auth.resendVerification(email);
  box.innerHTML = res.ok
    ? `<div class="alert success">${res.data.message}</div>`
    : `<div class="alert error">${res.error || 'Gagal mengirim ulang.'}</div>`;
});
</script>
</body>
</html>
